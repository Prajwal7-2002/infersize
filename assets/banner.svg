<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Top Accent Border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#borderGrad)" stroke-width="4" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Ambient Light Blobs -->
  <circle cx="160" cy="180" r="140" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />
  <circle cx="1040" cy="120" r="180" fill="#06b6d4" opacity="0.04" filter="url(#glow)" />

  <!-- LEFT: Graphic Icon Die (180x180) -->
  <g transform="translate(70, 90)">
    <!-- Die Base -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="2" />
    <rect x="12" y="12" width="156" height="156" rx="26" fill="#0c1220" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />

    <!-- Circuit Trace Lines -->
    <g opacity="0.4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round">
      <line x1="-20" y1="40" x2="12" y2="40" />
      <line x1="-20" y1="90" x2="12" y2="90" />
      <line x1="-20" y1="140" x2="12" y2="140" />
      <line x1="168" y1="40" x2="200" y2="40" />
      <line x1="168" y1="90" x2="200" y2="90" />
      <line x1="168" y1="140" x2="200" y2="140" />
      <circle cx="-20" cy="40" r="2.5" fill="#f59e0b" />
      <circle cx="-20" cy="90" r="2.5" fill="#f59e0b" />
      <circle cx="-20" cy="140" r="2.5" fill="#f59e0b" />
      <circle cx="200" cy="40" r="2.5" fill="#f59e0b" />
      <circle cx="200" cy="90" r="2.5" fill="#f59e0b" />
      <circle cx="200" cy="140" r="2.5" fill="#f59e0b" />
    </g>

    <!-- Roofline Line -->
    <path d="M 28 140 L 88 52 L 148 52" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <circle cx="88" cy="52" r="4.5" fill="#22d3ee" filter="url(#glow)" />

    <!-- Lightning Bolt -->
    <path d="M 102 36 L 54 104 L 88 104 L 76 152 L 128 84 L 94 84 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <!-- RIGHT: Branding Text & Typography -->
  <g transform="translate(300, 68)">
    <!-- Monospace Pill Badge -->
    <g>
      <rect x="0" y="0" width="370" height="28" rx="14" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#fbbf24" filter="url(#glow)" />
      <text x="28" y="18" fill="#fbbf24" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">PRE-FLIGHT LLM SERVING CAD &amp; TCO</text>
    </g>

    <!-- Title -->
    <text x="0" y="94" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      infersize <tspan fill="#f59e0b" font-size="52">⚡</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      Analytical Performance Modeling, Multi-GPU Matrix &amp; Cloud Serving Economics
    </text>

    <!-- Feature Tags Strip -->
    <g transform="translate(2, 172)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="144" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">⚡ &lt; 10ms CPU Solve</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(154, 0)">
        <rect width="168" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🛡️ Zero CUDA OOMs</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(332, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">📊 $/1M Tokens Roofline</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(522, 0)">
        <rect width="176" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="14" y="21" fill="#e2e8f0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">🤗 HuggingFace Dynamic</text>
      </g>

      <!-- Tag 5 -->
      <g transform="translate(708, 0)">
        <rect width="138" height="34" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">📦 Pure Python</text>
      </g>
    </g>
  </g>
</svg>
